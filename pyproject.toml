[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codestra-leads-workstation"
version = "0.1.0"
description = "Local-first lead operations workstation with auditable import and dedupe."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leads-workstation = "leads_workstation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
