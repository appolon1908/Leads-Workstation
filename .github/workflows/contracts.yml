name: leads-workstation-ci
on:
  pull_request:
  push:
    branches: [development, testing, staging, production, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts
        run: |
          python -m json.tool contracts/integration-map.v1.json >/dev/null
          python -m json.tool contracts/lead-record.schema.json >/dev/null
      - name: Verify country and business fields are distinct
        run: |
          python - <<'PY'
          import json
          p=json.load(open("contracts/lead-record.schema.json"))["properties"]
          assert "country" in p and "business_category" in p
          assert "country" != "business_category"
          print("lead contract OK")
          PY
      - name: Test and static quality dependencies
        run: python -m pip install -q -e '.[production]' ruff pyyaml
      - name: Static quality
        run: |
          ruff check src tests scripts
          python -m compileall -q src tests scripts
          python -m tabnanny src tests scripts
          python - <<'PY'
          import yaml
          with open("contracts/leads-v2.openapi.yaml", "r", encoding="utf-8") as fh:
              spec = yaml.safe_load(fh)
          assert spec["openapi"].startswith("3.")
          assert "/api/v2/leads" in spec["paths"]
          print("OpenAPI contract OK")
          PY
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Security scan
        run: python scripts/security_scan.py

  postgres_integration:
    name: postgres-redis-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: leads_test
          POSTGRES_USER: leads_test
          POSTGRES_PASSWORD: leads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leads_test -d leads_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      LEADS_POSTGRES_TEST_DSN: postgresql://leads_test:leads_test@127.0.0.1:5432/leads_test
      LEADS_ALLOW_TEST_RESET: "1"
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: python -m pip install -e '.[production]'
      - name: Full V2 production test suite
        run: python -m unittest discover -s tests -v
      - name: V2 compile
        run: python -m compileall -q src

  privacy_security:
    name: privacy-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify private lead payload is not tracked
        run: |
          test -z "$(git ls-files 'data/private/**')"
          printf '%s\n' 'data/private/sample.csv' | git check-ignore --stdin
      - name: Scan repository for accidental secrets and forbidden artifacts
        run: python scripts/security_scan.py
