name: leads-workstation-ci

on:
  pull_request:
  push:
    branches: [development, testing, staging, production, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts
        run: |
          python -m json.tool contracts/integration-map.v1.json >/dev/null
          python -m json.tool contracts/lead-record.schema.json >/dev/null
      - name: Verify country and business fields are distinct
        run: |
          python - <<'PY'
          import json
          p=json.load(open("contracts/lead-record.schema.json"))["properties"]
          assert "country" in p and "business_category" in p
          assert "country" != "business_category"
          print("lead contract OK")
          PY
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src

  postgres_integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: leads_test
          POSTGRES_PASSWORD: leads_test_only
          POSTGRES_DB: leads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leads_test -d leads_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production extras
        run: python -m pip install -e '.[production]'
      - name: PostgreSQL and Redis integration tests
        env:
          PYTHONPATH: src
          LEADS_POSTGRES_TEST_DSN: postgresql://leads_test:leads_test_only@127.0.0.1:5432/leads_test
          LEADS_ALLOW_TEST_RESET: "1"
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: python -m unittest tests.test_postgres_integration -v

  privacy_security:
    name: privacy-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify private lead payload is not tracked
        run: |
          test -z "$(git ls-files 'data/private/**')"
          printf '%s
' 'data/private/sample.csv' | git check-ignore --stdin
      - name: Scan tracked repository for accidental secrets
        run: python scripts/security_scan.py

  codestra_control_plane:
    name: codestra-control-plane
    needs: [validate, postgres_integration, privacy_security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce lead data privacy and certification evidence
        run: |
          printf '%s
' 'data/private/sample.csv' | git check-ignore --stdin
          test -f docs/CERTIFICATION-2026-10-07.md
          grep -q '88,379' docs/CERTIFICATION-2026-10-07.md
          grep -q 'Lead/contact payload must never be pushed to a public repository' AGENTS.md
          test -f scripts/security_scan.py

  codestra_control_plane_legacy:
    name: codestra/control-plane
    needs: [validate, postgres_integration, privacy_security, codestra_control_plane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governed workstation artifacts
        run: |
          test -f scripts/certify.ps1
          test -f scripts/stage-private-data.ps1
          test -f src/leads_workstation/db.py
          test -f src/leads_workstation/auth.py
          test -f src/leads_workstation/platform.py
          test -f src/leads_workstation/storage.py
          test -f tests/test_import.py
          test -f tests/test_v2_platform.py
