name: contracts
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, codestra-backup-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate JSON contracts
        run: |
          python -m json.tool contracts/integration-map.v1.json >/dev/null
          python -m json.tool contracts/lead-record.schema.json >/dev/null
      - name: Verify country and business fields are distinct
        run: |
          python - <<'PY'
          import json
          p=json.load(open("contracts/lead-record.schema.json"))["properties"]
          assert "country" in p
          assert "business_category" in p
          assert "country" != "business_category"
          print("lead contract OK")
          PY
